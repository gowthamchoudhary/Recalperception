openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Recall API — personal video memory search engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account and session operations
  - name: videos
    description: Video library operations
  - name: search
    description: Memory search operations
  - name: review
    description: Needs-review queue operations
  - name: people
    description: Tagged people operations
  - name: stats
    description: Dashboard summary
  - name: chats
    description: Dashboard chat threads
  - name: voice
    description: Voice input (speech-to-text) and spoken answers (text-to-speech)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently logged-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List all videos in the library
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [indexed, processing, flagged, failed]
      responses:
        "200":
          description: Video list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
  /videos/upload:
    post:
      operationId: uploadVideo
      tags: [videos]
      summary: Upload a video (file or URL) to VideoDB and start ingestion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VideoUploadInput"
      responses:
        "202":
          description: Accepted — ingestion started in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: VideoDB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos/{id}/privacy-scan:
    post:
      operationId: privacyScanVideo
      tags: [videos]
      summary: Run the privacy/sensitivity scene scan for a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Scan started in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Video is not ready for scanning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: VideoDB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos/{id}/export-clip:
    post:
      operationId: exportClip
      tags: [videos]
      summary: Export a trimmed clip of a video as a downloadable file
      description: >-
        Generates a downloadable file for exactly the requested in/out range
        using VideoDB clip extraction. Nothing is stored server-side; the
        clip is rendered on demand.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClipExportInput"
      responses:
        "200":
          description: Clip rendered; download URL ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipExport"
        "400":
          description: Invalid range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Video is not ready for export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Clip rendering failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: VideoDB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos/{id}/confirm-language:
    post:
      operationId: confirmVideoLanguage
      tags: [videos]
      summary: Re-transcribe a video with a user-confirmed language
      description: >-
        Used from the review queue when a video was flagged for a likely
        language-confusion misdetection. Re-runs transcription with the
        chosen language code and resolves the language review item.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmLanguageBody"
      responses:
        "200":
          description: Transcript regenerated and review item resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: VideoDB not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos/{id}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a single video with details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateVideo
      tags: [videos]
      summary: Update video metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /videos/{id}/find:
    get:
      operationId: findInVideo
      tags: [videos]
      summary: AI moment lookup inside a single video
      description: >-
        Answers "where in THIS video did X happen" — semantic search scoped to
        one video, falling back to keyword matching over its indexed moments.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Best matching moment, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindInVideoResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /search:
    get:
      operationId: searchMemories
      tags: [search]
      summary: Search the video archive by natural language query
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /chats:
    get:
      operationId: listChats
      tags: [chats]
      summary: List the user's chats, most recently active first
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
    post:
      operationId: createChat
      tags: [chats]
      summary: Start a new chat thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
  /chats/{id}:
    get:
      operationId: getChat
      tags: [chats]
      summary: Get a chat with its full message history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateChat
      tags: [chats]
      summary: Rename a chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteChat
      tags: [chats]
      summary: Delete a chat and its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /chats/{id}/messages:
    post:
      operationId: sendChatMessage
      tags: [chats]
      summary: Send a message and get the assistant's researched reply
      description: >-
        Runs the full search pipeline (context rewrite, intent classification,
        retrieval, person confirmation, reranking, answering) against the
        user's archive. With the default JSON Accept header the response is
        the completed turn. When the request's Accept header includes
        text/event-stream, the server streams Server-Sent Events instead:
        `stage` events ({"stage": "..."}) as each pipeline phase starts,
        then one final `result` event whose data is the same ChatTurn JSON,
        or an `error` event ({"error": "..."}).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Completed turn (user message + assistant reply)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTurn"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Search backend not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sources/status:
    get:
      operationId: getSourcesStatus
      tags: [sources]
      summary: Connection status for external ingestion sources
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesStatus"
  /sources/photos/session:
    post:
      operationId: createPhotosSession
      tags: [sources]
      summary: Create a Google Photos Picker session
      responses:
        "200":
          description: Picker session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotosSession"
        "409":
          description: Google Photos not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sources/photos/session/{id}:
    get:
      operationId: getPhotosSession
      tags: [sources]
      summary: Poll a picker session until the user finished picking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Picker session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotosSession"
        "409":
          description: Google Photos not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sources/photos/items:
    get:
      operationId: listPhotosItems
      tags: [sources]
      summary: List picked videos from a finished picker session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Picked videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhotosItem"
        "409":
          description: Google Photos not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sources/photos/import:
    post:
      operationId: importPhotosItem
      tags: [sources]
      summary: Import one picked Google Photos video into the ingestion pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotosImport"
      responses:
        "202":
          description: Import accepted; ingestion runs in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedVideo"
        "409":
          description: Google Photos not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /sources/youtube/videos:
    get:
      operationId: listYoutubeVideos
      tags: [sources]
      summary: List the connected YouTube channel's public and unlisted videos
      responses:
        "200":
          description: Channel videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YoutubeVideo"
        "409":
          description: YouTube not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /review-items:
    get:
      operationId: listReviewItems
      tags: [review]
      summary: List pending needs-review items
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"
  /review-items/{id}:
    patch:
      operationId: resolveReviewItem
      tags: [review]
      summary: Accept or discard a review item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewResolution"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List tagged people with appearance counts
      responses:
        "200":
          description: People list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
  /people/enrolled:
    get:
      operationId: listEnrolledPeople
      tags: [people]
      summary: List people enrolled for face-based person search
      responses:
        "200":
          description: Enrolled people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrolledPerson"
    post:
      operationId: enrollPerson
      tags: [people]
      summary: Enroll a person for face-based search from a reference photo
      description: >-
        Indexes the largest face in the reference photo into the AWS
        Rekognition face collection and stores the returned FaceId under the
        given name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EnrollPersonInput"
      responses:
        "201":
          description: Person enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolledPerson"
        "400":
          description: Unusable photo (no clear face) or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Face indexing failed upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Face recognition is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /people/enrolled/{id}:
    patch:
      operationId: updateEnrolledPerson
      tags: [people]
      summary: Rename an enrolled person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolledPersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolledPerson"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteEnrolledPerson
      tags: [people]
      summary: Remove an enrolled person (and their face from the collection)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Library summary stats for the dashboard
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStats"
  /voice/status:
    get:
      operationId: getVoiceStatus
      tags: [voice]
      summary: Whether voice features (ElevenLabs) are configured
      responses:
        "200":
          description: Voice availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceStatus"
  /voice/transcribe:
    post:
      operationId: transcribeVoice
      tags: [voice]
      summary: Transcribe a recorded voice query to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/VoiceTranscribeInput"
      responses:
        "200":
          description: Transcription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "503":
          description: Voice not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /voice/tts:
    post:
      operationId: synthesizeSpeech
      tags: [voice]
      summary: Speak an assistant answer aloud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TtsInput"
      responses:
        "200":
          description: MP3 audio, base64-encoded for easy playback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TtsResult"
        "503":
          description: Voice not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiMessage:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Video:
      type: object
      required:
        [id, title, thumbnailUrl, durationSeconds, uploadedAt, status, tags, people, source]
      properties:
        id: { type: integer }
        title: { type: string }
        thumbnailUrl: { type: string }
        videoUrl: { type: ["string", "null"] }
        durationSeconds: { type: integer }
        uploadedAt: { type: string }
        recordedAt: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        status: { type: string, enum: [indexed, processing, flagged, failed] }
        source: { type: string, enum: [gallery, google_photos, youtube] }
        playerUrl: { type: ["string", "null"] }
        indexError: { type: ["string", "null"] }
        detectedLanguage: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        people:
          type: array
          items: { type: string }
    VideoDetail:
      allOf:
        - $ref: "#/components/schemas/Video"
        - type: object
          required: [transcriptExcerpt]
          properties:
            transcriptExcerpt: { type: ["string", "null"] }
            sceneCount: { type: ["integer", "null"] }
            detectedLanguage: { type: ["string", "null"] }
    User:
      type: object
      required: [id, email, name, createdAt, languageProfile]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        createdAt: { type: string }
        languageProfile:
          type: array
          items: { type: string }
    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        languageProfile:
          type: array
          items: { type: string }
          description: Languages the user regularly films in, used to flag likely transcription misdetections.
    SignupInput:
      type: object
      required: [email, password, name]
      properties:
        # format: email intentionally omitted — orval emits zod-v4 `zod.email()`
        # against our zod v3 import. The server validates the format instead.
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    VideoUploadInput:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Video file to upload
        url:
          type: string
          description: Public video URL (YouTube, Google Photos, or a direct file link)
        title: { type: string }
        recordedAt: { type: string }
        location: { type: string }
        source: { type: string, enum: [gallery, google_photos, youtube] }
        requestedLanguage:
          type: string
          description: >-
            Optional language code to tell the transcription model what to
            expect (e.g. "hi", "ta"). If omitted, the language is auto-detected.
        privacyRequest:
          type: string
          maxLength: 500
          description: >-
            Optional free-text request applied to this upload's privacy scan —
            e.g. "skip anything with my ex". Matching scenes are flagged for
            review instead of auto-included.
    VideoUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        location: { type: string }
        recordedAt: { type: string }
        tags:
          type: array
          items: { type: string }
        people:
          type: array
          items: { type: string }
    ClipExportInput:
      type: object
      required: [startSeconds, endSeconds]
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          minimum: 0
    ClipExport:
      type: object
      required: [downloadUrl, name]
      properties:
        downloadUrl:
          type: string
          description: Direct URL to download the rendered clip file.
        name:
          type: string
          description: Suggested filename for the clip.
    ConfirmLanguageBody:
      type: object
      required: [languageCode]
      properties:
        languageCode:
          type: string
          minLength: 1
          description: The user-confirmed ISO language code for the video transcript.
    SearchResult:
      type: object
      required: [id, videoId, videoTitle, thumbnailUrl, snippet, matchType, timestampSeconds, durationSeconds]
      properties:
        id: { type: integer }
        videoId: { type: integer }
        videoTitle: { type: string }
        thumbnailUrl: { type: string }
        videoUrl: { type: ["string", "null"] }
        snippet: { type: string }
        matchType: { type: string, enum: [speech, scene, person, title] }
        matchReason:
          type: ["string", "null"]
          description: One-sentence LLM explanation of why this result matches the query (null when reranking was unavailable)
        timestampSeconds: { type: integer }
        durationSeconds: { type: integer }
        people:
          type: array
          items: { type: string }
        recordedAt: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
    SourcesStatus:
      type: object
      required: [oauthConfigured, googlePhotos, youtube]
      properties:
        oauthConfigured: { type: boolean }
        googlePhotos: { type: boolean }
        youtube: { type: boolean }
    PhotosSession:
      type: object
      required: [sessionId, pickerUri, mediaItemsSet, pollIntervalMs]
      properties:
        sessionId: { type: string }
        pickerUri: { type: string }
        mediaItemsSet: { type: boolean }
        pollIntervalMs: { type: integer }
    PhotosItem:
      type: object
      required: [id, filename]
      properties:
        id: { type: string }
        filename: { type: string }
        mimeType: { type: ["string", "null"] }
    PhotosImport:
      type: object
      required: [sessionId, itemId]
      properties:
        sessionId: { type: string, minLength: 1 }
        itemId: { type: string, minLength: 1 }
        privacyRequest: { type: string, maxLength: 500 }
    ImportedVideo:
      type: object
      required: [id, title, status]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
    YoutubeVideo:
      type: object
      required: [videoId, title, privacyStatus]
      properties:
        videoId: { type: string }
        title: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        publishedAt: { type: ["string", "null"] }
        privacyStatus: { type: string }
    ReviewItem:
      type: object
      required: [id, videoId, videoTitle, thumbnailUrl, reason, status, createdAt]
      properties:
        id: { type: integer }
        videoId: { type: integer }
        videoTitle: { type: string }
        thumbnailUrl: { type: string }
        reason: { type: string }
        detail: { type: ["string", "null"] }
        status: { type: string, enum: [pending, accepted, discarded] }
        createdAt: { type: string }
    ReviewResolution:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, discarded] }
    Person:
      type: object
      required: [id, name, appearanceCount]
      properties:
        id: { type: integer }
        name: { type: string }
        appearanceCount: { type: integer }
        lastSeenAt: { type: ["string", "null"] }
    EnrolledPerson:
      type: object
      required: [id, name, thumbnailUrl, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        thumbnailUrl:
          type: string
          description: Data-URL copy of the reference photo for display
        createdAt: { type: string }
    EnrollPersonInput:
      type: object
      required: [name, photo]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        photo:
          type: string
          format: binary
          description: Reference photo (JPEG/PNG) with one clear face
    EnrolledPersonUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    PersonFilter:
      type: object
      required: [personName, sceneQuery, status]
      properties:
        personName:
          type: string
          description: Enrolled person detected in the query
        sceneQuery:
          type: string
          description: The scene description actually used for semantic search
        status:
          type: string
          enum: [applied, unavailable]
          description: >-
            "applied" when results were filtered by confirmed face matches;
            "unavailable" when face recognition was unreachable/misconfigured
            and scene-only results are shown instead.
    SearchResponse:
      type: object
      required: [results, intent]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        personFilter:
          oneOf:
            - $ref: "#/components/schemas/PersonFilter"
            - type: "null"
          description: Present when an enrolled person was detected in the query
        intent:
          type: string
          enum: [search, count, recency, group]
          description: How the query was routed after intent classification
        answer:
          oneOf:
            - type: string
            - type: "null"
          description: Natural-language answer shown above the clips (count/recency intents)
    LibraryStats:
      type: object
      required: [totalVideos, totalHoursIndexed, totalPeople, totalScenes, pendingReviewCount]
      properties:
        totalVideos: { type: integer }
        totalHoursIndexed: { type: number }
        totalPeople: { type: integer }
        totalScenes: { type: integer }
        pendingReviewCount: { type: integer }
    Chat:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    ChatDetail:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [id, chatId, role, content, createdAt]
      properties:
        id: { type: integer }
        chatId: { type: integer }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string }
        voice:
          type: boolean
          description: User message originated from voice input
        personIds:
          type: array
          items: { type: integer }
          description: Explicit person mentions attached to a user message
        personNames:
          type: array
          items: { type: string }
          description: Names for the personIds at send time (for display)
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
          description: Clip results backing an assistant reply
        personFilter:
          oneOf:
            - $ref: "#/components/schemas/PersonFilter"
            - type: "null"
        intent:
          type: string
          enum: [search, count, recency, group]
        answer:
          type: ["string", "null"]
        failed:
          type: boolean
          description: Assistant turn ended in an error; content holds the message
    ChatInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
    ChatUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    ChatMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 2000
          description: May be empty only when personIds are provided
        personIds:
          type: array
          items: { type: integer }
          maxItems: 5
          description: Enrolled person ids mentioned via "/" pills; multiple ids must ALL appear (AND)
        voice:
          type: boolean
          description: Message text came from voice transcription
    ChatTurn:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/ChatMessage"
        assistantMessage:
          $ref: "#/components/schemas/ChatMessage"
    FindInVideoResult:
      type: object
      required: [found]
      properties:
        found: { type: boolean }
        timestampSeconds: { type: ["integer", "null"] }
        snippet: { type: ["string", "null"] }
        matchType: { type: ["string", "null"] }
    VoiceStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    VoiceTranscribeInput:
      type: object
      required: [audio]
      properties:
        audio:
          type: string
          format: binary
          description: Recorded audio (webm/ogg/mp4/wav), max ~15MB
    TranscriptionResult:
      type: object
      required: [text]
      properties:
        text: { type: string }
    TtsInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1200
    TtsResult:
      type: object
      required: [audioBase64, mimeType]
      properties:
        audioBase64:
          type: string
          description: Base64-encoded MP3 audio of the spoken answer
        mimeType: { type: string }
